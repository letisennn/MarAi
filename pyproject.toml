[project]
name = "marc-ai"
version = "0.1.0.dev0"
description = "Private research engine for Nordic small-cap market psychology and discovery"
requires-python = ">=3.11"
readme = "README.md"

# v0.1 dependency set — only what the market-baseline slice actually uses.
# Deferred on purpose: polars (add when transforms need the speed), anthropic
# (v0.5), scikit-learn/lightgbm (v0.7), news/social/search client libs.
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "python-dateutil>=2.9",
    "streamlit>=1.36",
    "plotly>=5.22",
    "yfinance>=0.2.40",   # real price source (default); synthetic source for offline/demo
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
]

[project.scripts]
marc = "marc.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/marc"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "app"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 off: many lines are inline SQL strings where wrapping hurts readability.
# B905: zip(strict=) — noise for internal research code.
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
packages = ["marc"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

# Guardrail: the targets layer uses future data by design and must never be
# imported by the features layer. Enforced by tests/test_layering.py.
